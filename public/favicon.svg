<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fazaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111723" />
      <stop offset="50%" stop-color="#080B10" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="fazaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#2EE6A6" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#182436" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Primary Electric Teal Gradient for Upper Wing & Spine -->
    <linearGradient id="fazaTeal" x1="20%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BFFC6" />
      <stop offset="45%" stop-color="#2EE6A6" />
      <stop offset="100%" stop-color="#0FB37F" />
    </linearGradient>

    <!-- Secondary Cyan Gradient for Mid Settlement Wing -->
    <linearGradient id="fazaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2EE6A6" />
    </linearGradient>

    <!-- Soft Core Radial Glow -->
    <radialGradient id="fazaCoreGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#00D2B4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for crisp glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#fazaBg)" stroke="url(#fazaBorder)" stroke-width="12" />

  <!-- Ambient Glow -->
  <circle cx="240" cy="240" r="180" fill="url(#fazaCoreGlow)" />

  <!-- Central Faza 'F' Monogram -->
  <g filter="url(#glowFilter)">
    <!-- Main Spine & Top Bar (Party 1 Commitment Wing) -->
    <path
      d="M 144 140
         C 144 126.745 154.745 116 168 116
         L 352 116
         C 362.609 116 372.33 121.996 377.106 131.472
         L 348 188
         C 344.5 195 337.2 200 329 200
         L 224 200
         L 224 372
         C 224 383.046 215.046 392 204 392
         L 164 392
         C 152.954 392 144 383.046 144 372
         Z"
      fill="url(#fazaTeal)"
    />

    <!-- Middle Bar (Party 2 Bilateral Stake & Lock Wing) -->
    <path
      d="M 224 240
         L 316 240
         C 324.2 240 331.5 245 335 252
         L 316 292
         C 312 300 304 306 295 306
         L 224 306
         Z"
      fill="url(#fazaCyan)"
    />

    <!-- Settlement Node / Spark -->
    <circle cx="340" cy="268" r="9" fill="#5BFFC6" />
    <circle cx="340" cy="268" r="18" fill="#2EE6A6" opacity="0.35" />
  </g>
</svg>